<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPEN_UP</title>
<link rel="stylesheet" href="/theme.css">
<style>
  html, body { overflow: hidden; }
  #win { margin: 14px 0 0; padding: 18px 14px 10px; min-height: calc(100vh - 14px); border-width: 4px; }
  .top { display: flex; justify-content: space-between; gap: 12px; white-space: nowrap; }
  .file { overflow: hidden; text-overflow: ellipsis; }
  .prompt { display: flex; align-items: center; gap: 8px; font-size: 20px; margin: 8px 0 6px; border-bottom: 1px solid var(--fg); padding-bottom: 4px; }
  .prompt input { font-size: 20px; }
  #list { max-height: 300px; overflow-y: auto; margin: 0; padding: 0; list-style: none; }
  #list li { display: flex; gap: 10px; padding: 3px 8px; cursor: pointer; white-space: nowrap; }
  #list li .n { width: 2ch; color: var(--dim); }
  #list li .name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  #list li .why { color: var(--dim); }
  #list li.sel { background: var(--fg); color: var(--bg); }
  #list li.sel .n, #list li.sel .why { color: var(--bg); }
  #list li.sep { cursor: pointer; color: var(--dim); justify-content: center; }
  #list li.sep.sel { color: var(--bg); }
  .guess { border: 1px solid currentColor; padding: 0 5px; font-size: 11px; font-weight: 700; letter-spacing: .5px; }
  .foot { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--dim); font-size: 12px; flex-wrap: wrap; }
  .empty { padding: 6px; color: var(--dim); }
</style>
</head>
<body>
<div id="win" class="box">
  <span class="label inv">&nbsp;OPEN_UP v1.0&nbsp;</span>
  <div class="top">
    <span class="dim">OPEN WITH...</span>
    <span class="file" id="file">loading<span class="blink">_</span></span>
  </div>
  <div class="prompt"><span>&gt;</span><input id="q" autocomplete="off" spellcheck="false" placeholder=""><span class="blink" id="cur">█</span></div>
  <ul id="list"></ul>
  <div class="foot">
    <label class="check"><input type="checkbox" id="always"><span class="mark"></span> always use for <span id="ext">.?</span></label>
    <span class="dim">↑↓ move · ⏎ open · ⇧⏎ always · ⇥ others · esc quit</span>
  </div>
</div>
<script>
const native = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.openup;
const post = (m) => native ? native.postMessage(m) : console.log("native:", m);
const $ = (id) => document.getElementById(id);

let S = null, expanded = false, sel = 0, rows = [];

function fmtWhy(a) {
  if (!a.reasons) return "";
  const r = a.reasons.filter(x => x !== "macOS");
  return r.length ? r.join(" · ") : "macOS";
}

function build() {
  const q = $("q").value.trim().toLowerCase();
  rows = [];
  if (q) {
    for (const a of [...S.ranked, ...S.others]) if (a.name.toLowerCase().includes(q)) rows.push({ app: a });
  } else {
    S.ranked.forEach((a, i) => rows.push({ app: a, guess: i === 0 }));
    if (S.others.length) rows.push({ sep: true });
    if (expanded) S.others.forEach(a => rows.push({ app: a }));
  }
  sel = Math.min(sel, Math.max(rows.length - 1, 0));
  render();
}

function render() {
  const ul = $("list");
  ul.innerHTML = "";
  if (!rows.length) { ul.innerHTML = '<li class="empty">no matching apps</li>'; }
  rows.forEach((r, i) => {
    const li = document.createElement("li");
    if (r.sep) {
      li.className = "sep";
      li.textContent = expanded ? "── hide others (tab) ──" : `── show ${S.others.length} other apps (tab) ──`;
      li.onclick = () => { expanded = !expanded; sel = i; build(); };
    } else {
      li.innerHTML = `<span class="n">${i < 9 ? i + 1 : ""}</span><span class="name"></span><span class="why"></span>`;
      li.querySelector(".name").textContent = (i === sel ? "▶ " : "  ") + r.app.name;
      const why = li.querySelector(".why");
      if (r.guess) why.innerHTML = '<span class="guess">GUESS</span> ';
      why.append(fmtWhy(r.app));
      li.onclick = () => { sel = i; choose(false); };
      li.onmousemove = () => { if (sel !== i) { sel = i; render(); } };
    }
    if (i === sel) li.classList.add("sel");
    ul.appendChild(li);
  });
  const s = ul.children[sel]; if (s) s.scrollIntoView({ block: "nearest" });
  requestAnimationFrame(() => post({ type: "resize", height: $("win").scrollHeight }));
}

async function choose(forceAlways) {
  const r = rows[sel];
  if (!r) return;
  if (r.sep) { expanded = !expanded; build(); return; }
  const always = forceAlways || $("always").checked;
  try {
    await fetch("/api/pick", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ext: S.ext, app: r.app.path, always }) });
  } catch (e) { /* still open the file */ }
  if (!native) { alert("Picked " + r.app.name + ".\nLaunching apps only works from the OPEN_UP Mac helper."); return; }
  post({ type: "open", app: r.app.path, files: S.files });
}

document.addEventListener("keydown", (e) => {
  if (!S) { if (e.key === "Escape") post({ type: "cancel" }); return; }
  if (e.key === "ArrowDown") { sel = Math.min(sel + 1, rows.length - 1); render(); e.preventDefault(); }
  else if (e.key === "ArrowUp") { sel = Math.max(sel - 1, 0); render(); e.preventDefault(); }
  else if (e.key === "Enter") { choose(e.shiftKey); e.preventDefault(); }
  else if (e.key === "Tab") { expanded = !expanded; if (!expanded) sel = Math.min(sel, S.ranked.length); build(); e.preventDefault(); }
  else if (e.key === "Escape") { if ($("q").value) { $("q").value = ""; build(); } else post({ type: "cancel" }); e.preventDefault(); }
  else if ((e.metaKey || e.ctrlKey) && /^[1-9]$/.test(e.key)) { const i = +e.key - 1; if (rows[i] && !rows[i].sep) { sel = i; choose(false); } e.preventDefault(); }
});
$("q").addEventListener("input", () => { sel = 0; build(); });
$("q").addEventListener("focus", () => $("cur").style.visibility = "hidden");
$("q").addEventListener("blur", () => $("cur").style.visibility = "");

(async function init() {
  const sid = new URLSearchParams(location.search).get("s");
  try {
    const res = await fetch("/api/session/" + encodeURIComponent(sid));
    if (!res.ok) throw new Error((await res.json()).error || res.status);
    S = await res.json();
  } catch (e) {
    $("file").textContent = "ERROR: " + e.message;
    return;
  }
  const first = S.files[0].split("/").pop();
  $("file").textContent = first + (S.files.length > 1 ? `  (+${S.files.length - 1} more)` : "");
  $("file").title = S.files.join("\n");
  $("ext").textContent = S.ext === "(none)" ? "files with no extension" : "." + S.ext;
  if (!S.ranked.length) expanded = true;
  build();
  $("q").focus();
})();
</script>
</body>
</html>
